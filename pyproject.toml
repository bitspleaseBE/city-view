[project]
name = "city-view"
version = "0.1.0"
description = "Generate Antwerp streets and Klein Antwerpen district tiles in Blender"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
textures = ["pillow", "numpy", "scipy"]  # only to re-render assets/textures from the reference photos

[project.scripts]
cityview = "cityview.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cityview*"]
