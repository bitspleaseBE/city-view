<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>City View — Klein Antwerpen · Gounod tram</title>
    <style>
      :root {
        --ink: #1a2430;
        --muted: #3d4a5c;
        --panel: rgba(255, 255, 255, 0.72);
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #6eb6ff;
        font-family: "Iowan Old Style", "Palatino Linotype", Palatino, serif;
        color: var(--ink);
      }
      canvas {
        display: block;
      }
      #hud {
        position: fixed;
        left: 20px;
        bottom: 20px;
        max-width: 28rem;
        padding: 14px 16px;
        background: var(--panel);
        border: 1px solid rgba(20, 40, 60, 0.12);
        backdrop-filter: blur(10px);
        pointer-events: none;
      }
      h1 {
        margin: 0 0 6px;
        font-size: 1.05rem;
        font-weight: 600;
      }
      p {
        margin: 0;
        font-size: 0.88rem;
        line-height: 1.4;
        color: var(--muted);
      }
      #status {
        position: fixed;
        top: 18px;
        right: 20px;
        font-size: 0.8rem;
        color: var(--muted);
        background: var(--panel);
        padding: 8px 12px;
        border: 1px solid rgba(20, 40, 60, 0.12);
      }
      #hint {
        position: fixed;
        top: 18px;
        left: 20px;
        font-size: 0.8rem;
        color: var(--muted);
        background: var(--panel);
        padding: 8px 12px;
        border: 1px solid rgba(20, 40, 60, 0.12);
      }
      #modes {
        position: fixed;
        top: 56px;
        left: 20px;
        display: flex;
        gap: 8px;
      }
      #modes button {
        font: inherit;
        font-size: 0.8rem;
        padding: 8px 12px;
        border: 1px solid rgba(20, 40, 60, 0.16);
        background: var(--panel);
        color: var(--ink);
        cursor: pointer;
      }
      #modes button.active {
        background: #1a2430;
        color: #f4efe6;
      }
      #ride {
        position: fixed;
        top: 18px;
        left: 50%;
        transform: translateX(-50%);
        min-width: 16rem;
        max-width: 28rem;
        padding: 12px 18px;
        background: var(--panel);
        border: 1px solid rgba(20, 40, 60, 0.14);
        backdrop-filter: blur(10px);
        text-align: center;
        display: none;
        pointer-events: none;
      }
      #ride .line {
        font-size: 0.95rem;
        font-weight: 600;
        margin: 0 0 4px;
      }
      #ride .next {
        font-size: 0.85rem;
        color: var(--muted);
        margin: 0;
      }
      #prompt {
        position: fixed;
        bottom: 96px;
        left: 50%;
        transform: translateX(-50%);
        padding: 10px 16px;
        background: rgba(26, 36, 48, 0.82);
        color: #f4efe6;
        font-size: 0.88rem;
        border: 1px solid rgba(255, 255, 255, 0.12);
        display: none;
        pointer-events: none;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div id="hint">Walk: click + WASD · Shift sprint · E tram · V free · N day/night</div>
    <div id="modes">
      <button type="button" id="btn-walk" class="active">Walk</button>
      <button type="button" id="btn-free">Free view</button>
      <button type="button" id="btn-night" aria-pressed="false">Night</button>
    </div>
    <div id="status">Loading sunny Klein Antwerpen…</div>
    <div id="ride">
      <p class="line" id="ride-line">Tram</p>
      <p class="next" id="ride-next">Next: —</p>
    </div>
    <div id="prompt"></div>
    <div id="hud">
      <h1>Gounod tram · Klein Antwerpen · 2018</h1>
      <p>
        Spawn at the Gounod halt. Press E on a stopped tram to ride; E again to get off at the next stop.
      </p>
    </div>
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
        }
      }
    </script>
    <script type="module">
      import * as THREE from "three";
      import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
      import { PointerLockControls } from "three/addons/controls/PointerLockControls.js";
      import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
      import { createTraffic } from "./traffic.js";
      import { createTransit } from "./transit.js";

      const status = document.getElementById("status");
      const hint = document.getElementById("hint");
      const btnWalk = document.getElementById("btn-walk");
      const btnFree = document.getElementById("btn-free");
      const btnNight = document.getElementById("btn-night");
      const rideEl = document.getElementById("ride");
      const rideLine = document.getElementById("ride-line");
      const rideNext = document.getElementById("ride-next");
      const promptEl = document.getElementById("prompt");
      const _rideCam = new THREE.Vector3();
      const _rideLook = new THREE.Vector3();

      const SKY = 0x6eb6ff;
      // Horizon haze: soft blue-grey so FogExp2 fades to sky, never black.
      const FOG_COLOR = 0xb8d4ea;
      const GROUND_SKIRT = 0xc4b59a;
      const scene = new THREE.Scene();
      // Soft zenith→horizon gradient so pedestrian POV feels like a real clear day.
      const skyCanvas = document.createElement("canvas");
      skyCanvas.width = 2;
      skyCanvas.height = 256;
      const skyCtx = skyCanvas.getContext("2d");
      // Zenith → horizon stops for day, dusk (horizon glow) and night; blended by paintSky().
      const SKY_DAY = ["#4aa0ff", "#6eb6ff", "#a8d4ff", "#d8e8f4"];
      const SKY_DUSK = ["#2b3a6e", "#7a5a8c", "#e8935c", "#ffc98a"];
      const SKY_NIGHT = ["#03060f", "#08101f", "#101c34", "#1d2c46"];
      const _c0 = new THREE.Color();
      const _c1 = new THREE.Color();
      function skyStop(i, t) {
        // t: 0 day → 1 night, passing through a dusk band around t ≈ 0.5.
        if (t < 0.5) return _c0.set(SKY_DAY[i]).lerp(_c1.set(SKY_DUSK[i]), t * 2).getStyle();
        return _c0.set(SKY_DUSK[i]).lerp(_c1.set(SKY_NIGHT[i]), (t - 0.5) * 2).getStyle();
      }
      function paintSky(t) {
        const grad = skyCtx.createLinearGradient(0, 0, 0, 256);
        grad.addColorStop(0, skyStop(0, t));
        grad.addColorStop(0.45, skyStop(1, t));
        grad.addColorStop(0.78, skyStop(2, t));
        grad.addColorStop(1, skyStop(3, t));
        skyCtx.fillStyle = grad;
        skyCtx.fillRect(0, 0, 2, 256);
      }
      paintSky(0);
      const skyTex = new THREE.CanvasTexture(skyCanvas);
      skyTex.colorSpace = THREE.SRGBColorSpace;
      scene.background = skyTex;
      // Light haze toward horizon — density retuned after city bounds load.
      scene.fog = new THREE.FogExp2(FOG_COLOR, 0.00055);

      const camera = new THREE.PerspectiveCamera(
        68,
        window.innerWidth / window.innerHeight,
        0.2,
        4500,
      );
      camera.position.set(-218.5, 1.7, -432.1);

      const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setClearColor(SKY, 1);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.18;
      document.body.appendChild(renderer.domElement);

      // Cheap IBL so glass/metal catch sky instead of looking like flat stickers.
      const pmrem = new THREE.PMREMGenerator(renderer);
      scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
      pmrem.dispose();

      const hemi = new THREE.HemisphereLight(0xb8d8ff, 0xb8a48a, 0.85);
      scene.add(hemi);
      const sun = new THREE.DirectionalLight(0xfff2d6, 1.35);
      sun.position.set(220, 320, -160);
      scene.add(sun);
      scene.add(sun.target);
      const fill = new THREE.DirectionalLight(0xcfe4ff, 0.35);
      fill.position.set(-160, 120, 200);
      scene.add(fill);

      // Visible sun disc + soft haze
      const sunMesh = new THREE.Mesh(
        new THREE.SphereGeometry(28, 16, 16),
        new THREE.MeshBasicMaterial({ color: 0xffe7a0 }),
      );
      sunMesh.position.copy(sun.position).normalize().multiplyScalar(900);
      scene.add(sunMesh);
      const sunHaze = new THREE.Mesh(
        new THREE.SphereGeometry(70, 12, 12),
        new THREE.MeshBasicMaterial({ color: 0xffe8b0, transparent: true, opacity: 0.18, depthWrite: false }),
      );
      sunHaze.position.copy(sunMesh.position);
      scene.add(sunHaze);
      // ---- Day / night -------------------------------------------------------------
      // `tod` eases 0 (sunny day) → 1 (night). Everything below is a pure function of it:
      // sky, fog, sun/moon + ambient light, façade window glow, street lamps (emissive heads
      // plus a few pooled point lights that follow the walker), car lamps and tram windows.
      const SUN_COL = new THREE.Color(0xfff2d6);
      const SUN_DUSK = new THREE.Color(0xff9a52);
      const MOON_COL = new THREE.Color(0x8fa6d8);
      const HEMI_SKY_DAY = new THREE.Color(0xb8d8ff);
      const HEMI_SKY_NIGHT = new THREE.Color(0x3a4f86);
      const HEMI_GND_DAY = new THREE.Color(0xb8a48a);
      const HEMI_GND_NIGHT = new THREE.Color(0x1a1c26);
      const FOG_NIGHT = new THREE.Color(0x0d1527);
      const FOG_DUSK = new THREE.Color(0xd9a07c);
      const CLEAR_DAY = new THREE.Color(SKY);
      const SUN_DAY_POS = new THREE.Vector3(220, 320, -160);
      const MOON_POS = new THREE.Vector3(-260, 300, 180);
      const _tmpCol = new THREE.Color();
      const smooth = (a, b, x) => {
        const u = Math.min(1, Math.max(0, (x - a) / (b - a)));
        return u * u * (3 - 2 * u);
      };
      let tod = new URLSearchParams(location.search).has("night") ? 1 : 0;
      let todTarget = tod;
      let todApplied = -1;
      let baseFogDensity = 0.00055; // retuned to the district size after the GLB loads
      let skirtMat = null;
      const glowMats = []; // { mat, scale }: emissive intensity = scale * glow(t)
      const lampHeads = []; // world positions of street-lamp heads
      const LAMP_LIGHTS = 4;
      const lampLights = [];
      for (let i = 0; i < LAMP_LIGHTS; i++) {
        const l = new THREE.PointLight(0xffc27a, 0, 24, 1.6);
        l.visible = false;
        scene.add(l);
        lampLights.push(l);
      }
      // Stars: a sparse dome that rides with the camera and fades in with the night.
      const starGeo = new THREE.BufferGeometry();
      {
        const n = 700;
        const pos = new Float32Array(n * 3);
        for (let i = 0; i < n; i++) {
          const u = Math.random() * 2 - 1;
          const a = Math.random() * Math.PI * 2;
          const r = Math.sqrt(1 - u * u);
          const y = Math.abs(u) * 0.9 + 0.1; // upper hemisphere only
          pos[i * 3] = Math.cos(a) * r * 2200;
          pos[i * 3 + 1] = y * 2200;
          pos[i * 3 + 2] = Math.sin(a) * r * 2200;
        }
        starGeo.setAttribute("position", new THREE.BufferAttribute(pos, 3));
      }
      const starMat = new THREE.PointsMaterial({
        color: 0xdfe8ff,
        size: 3.2,
        sizeAttenuation: false,
        transparent: true,
        opacity: 0,
        fog: false,
        depthWrite: false,
      });
      const stars = new THREE.Points(starGeo, starMat);
      stars.frustumCulled = false;
      stars.visible = false;
      scene.add(stars);

      // Debug / screenshot hook (no behaviour): window.__cityview.setNight(true), .camera, .walk
      window.__cityview = { camera, setNight: setTimeOfDay, get tod() { return tod; }, get walk() { return walkControls; } };

      function applyTimeOfDay(t) {
        const night = smooth(0.35, 0.95, t); // lights come on a little after the sun is down
        const dayAmt = 1 - smooth(0.0, 0.7, t);
        const dusk = Math.max(0, 1 - Math.abs(t - 0.45) / 0.45); // warm band mid-transition
        paintSky(t);
        skyTex.needsUpdate = true;

        // Fog + clear colour follow the horizon.
        _tmpCol.set(FOG_COLOR).lerp(FOG_DUSK, dusk * 0.6).lerp(FOG_NIGHT, smooth(0.3, 0.9, t));
        scene.fog.color.copy(_tmpCol);
        renderer.setClearColor(_tmpCol, 1);
        scene.fog.density = baseFogDensity * (1 + 0.5 * night);

        renderer.toneMappingExposure = 1.18 - 0.1 * night;
        scene.environmentIntensity = 1 - 0.86 * smooth(0.05, 0.8, t);

        hemi.color.copy(HEMI_SKY_DAY).lerp(HEMI_SKY_NIGHT, night);
        hemi.groundColor.copy(HEMI_GND_DAY).lerp(HEMI_GND_NIGHT, night);
        hemi.intensity = 0.85 - 0.62 * night;

        // One directional light plays the sun by day and the moon by night.
        sun.color.copy(SUN_COL).lerp(SUN_DUSK, dusk).lerp(MOON_COL, smooth(0.5, 0.9, t));
        sun.intensity = 1.35 * dayAmt + 0.3 * smooth(0.5, 1.0, t);
        sun.position.lerpVectors(SUN_DAY_POS, MOON_POS, smooth(0.2, 0.8, t));
        sunMesh.position.copy(sun.position).normalize().multiplyScalar(900);
        sunHaze.position.copy(sunMesh.position);
        sunMesh.material.color.set(0xffe7a0).lerp(_tmpCol.set(0xdfe6f5), smooth(0.4, 0.9, t));
        sunMesh.scale.setScalar(1 - 0.45 * smooth(0.4, 0.9, t));
        sunHaze.material.color.set(0xffe8b0).lerp(_tmpCol.set(0x8fa6d8), smooth(0.4, 0.9, t));
        sunHaze.material.opacity = 0.18 + 0.1 * dusk;
        fill.intensity = 0.35 - 0.2 * night;

        // Façade windows + lamp heads glow; cars and trams follow.
        const glow = smooth(0.4, 0.9, t);
        for (const g of glowMats) g.mat.emissiveIntensity = g.scale * glow;
        for (const l of lampLights) l.intensity = 38 * glow;
        traffic.setNight && traffic.setNight(glow);
        transit.setNight && transit.setNight(glow);

        starMat.opacity = smooth(0.55, 1.0, t) * 0.9;
        stars.visible = starMat.opacity > 0.01;
        skirtMat && skirtMat.color.set(GROUND_SKIRT).lerp(_tmpCol.set(0x23252b), night);

        const isNight = t > 0.5;
        btnNight.textContent = isNight ? "Day" : "Night";
        btnNight.setAttribute("aria-pressed", String(isNight));
        btnNight.classList.toggle("active", isNight);
        todApplied = t;
      }
      function setTimeOfDay(night) {
        todTarget = night ? 1 : 0;
      }
      function toggleTimeOfDay() {
        setTimeOfDay(todTarget < 0.5);
      }
      btnNight.addEventListener("click", toggleTimeOfDay);
      const _lampSort = new THREE.Vector3();
      let lampClock = 0;
      function updateLampLights(dt, walker) {
        if (todApplied < 0.4 || !lampHeads.length) {
          for (const l of lampLights) l.visible = false;
          return;
        }
        lampClock -= dt;
        if (lampClock > 0) return;
        lampClock = 0.35;
        const p = walker.position;
        // Nearest lamps to the walker get the real light; the rest stay glowing heads.
        const near = lampHeads
          .map((h) => ({ h, d: (h.x - p.x) ** 2 + (h.z - p.z) ** 2 }))
          .sort((a, b) => a.d - b.d)
          .slice(0, LAMP_LIGHTS);
        lampLights.forEach((l, i) => {
          const n = near[i];
          l.visible = !!n && n.d < 70 * 70;
          if (n) l.position.set(n.h.x, n.h.y - 0.25, n.h.z);
        });
      }

      let mode = "walk"; // walk | free
      const eyeHeight = 1.7;
      const walkSpeed = 7.5;
      const keys = { w: false, a: false, s: false, d: false, shift: false };
      let prevTime = performance.now();
      let cityRoot = null;
      let spawnPos = new THREE.Vector3(-218.5, eyeHeight, -432.1);
      let traffic = { update() {}, dispose() {} };
      let transit = { update() {}, dispose() {} };
      // Horizontal playable AABB (XZ), set after GLB load — keeps walk/orbit in-district.
      let playBounds = null;
      const _clampTmp = new THREE.Vector3();

      function softClampXZ(pos, bounds) {
        if (!bounds) return;
        const { minX, maxX, minZ, maxZ } = bounds;
        // Slide along edges: clamp each axis independently (no hard bounce).
        if (pos.x < minX) pos.x = minX;
        else if (pos.x > maxX) pos.x = maxX;
        if (pos.z < minZ) pos.z = minZ;
        else if (pos.z > maxZ) pos.z = maxZ;
      }

      function setupDistrictBounds(root) {
        const box = new THREE.Box3().setFromObject(root);
        const center = box.getCenter(new THREE.Vector3());
        const size = box.getSize(new THREE.Vector3());
        // Inset so the walker never stands on the absolute mesh rim / void.
        const inset = Math.max(18, Math.min(size.x, size.z) * 0.04);
        let minX = box.min.x + inset;
        let maxX = box.max.x - inset;
        let minZ = box.min.z + inset;
        let maxZ = box.max.z - inset;
        if (minX >= maxX) {
          const mid = (box.min.x + box.max.x) * 0.5;
          minX = mid - 20;
          maxX = mid + 20;
        }
        if (minZ >= maxZ) {
          const mid = (box.min.z + box.max.z) * 0.5;
          minZ = mid - 20;
          maxZ = mid + 20;
        }
        playBounds = { minX, maxX, minZ, maxZ };
        softClampXZ(walkControls.getObject().position, playBounds);
        softClampXZ(spawnPos, playBounds);

        // One cheap skirt plane so looking past the GLB ground isn't a black hole.
        const skirtSpan = Math.max(size.x, size.z) * 2.8;
        skirtMat = new THREE.MeshLambertMaterial({
          color: GROUND_SKIRT,
          fog: true,
          depthWrite: true,
        });
        const skirt = new THREE.Mesh(new THREE.CircleGeometry(skirtSpan * 0.5, 48), skirtMat);
        skirt.rotation.x = -Math.PI / 2;
        skirt.position.set(center.x, box.min.y - 0.35, center.z);
        skirt.receiveShadow = false;
        skirt.castShadow = false;
        skirt.renderOrder = -1;
        scene.add(skirt);

        // Soft haze: fade distant district edge into sky, not black void.
        const diag = size.length();
        scene.fog.color.setHex(FOG_COLOR);
        baseFogDensity = Math.max(0.00035, Math.min(0.00085, 1.15 / diag));
        scene.fog.density = baseFogDensity;
        // Free view: top-down overview height that frames the whole district.
        const fitH = Math.max(size.z, size.x / Math.max(0.5, camera.aspect)) / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)));
        freeCam.height = THREE.MathUtils.clamp(fitH * 0.85, 140, 1400);
        freeCam.maxH = THREE.MathUtils.clamp(fitH * 1.25, 220, 1800);
        freeCam.minH = 35;
      }

      const walkControls = new PointerLockControls(camera, document.body);
      scene.add(walkControls.getObject());
      // Simple humanoid capsule so Free view can frame the walker.
      const avatar = new THREE.Group();
      const bodyMat = new THREE.MeshLambertMaterial({ color: 0x3a4658 });
      const skinMat = new THREE.MeshLambertMaterial({ color: 0xc4a882 });
      const torso = new THREE.Mesh(new THREE.CapsuleGeometry(0.28, 0.85, 4, 8), bodyMat);
      torso.position.y = 1.05;
      const head = new THREE.Mesh(new THREE.SphereGeometry(0.18, 8, 8), skinMat);
      head.position.y = 1.72;
      avatar.add(torso, head);
      avatar.visible = false;
      scene.add(avatar);

      // Free view: locked top-down (no pitch/orbit). WASD / drag pans on XZ, wheel zooms height.
      const freeCam = { x: 0, z: 0, height: 320, minH: 35, maxH: 700 };
      const walkSaved = { x: 0, z: 0, yaw: 0 };
      const UP_WORLD = new THREE.Vector3(0, 1, 0);
      const UP_TOPDOWN = new THREE.Vector3(0, 0, -1); // north (-Z) is screen-up

      function applyFreeCamera() {
        camera.up.copy(UP_TOPDOWN);
        camera.position.set(freeCam.x, freeCam.height, freeCam.z);
        camera.lookAt(freeCam.x, 0, freeCam.z);
      }

      function panFree(dx, dz) {
        freeCam.x += dx;
        freeCam.z += dz;
        softClampXZ(freeCam, playBounds);
      }

      renderer.domElement.addEventListener(
        "wheel",
        (e) => {
          if (mode !== "free") return;
          e.preventDefault();
          freeCam.height = THREE.MathUtils.clamp(
            freeCam.height * Math.exp(e.deltaY * 0.001),
            freeCam.minH,
            freeCam.maxH,
          );
        },
        { passive: false },
      );
      let freeDrag = null;
      renderer.domElement.addEventListener("pointerdown", (e) => {
        if (mode !== "free" || e.button !== 0) return;
        freeDrag = { id: e.pointerId, x: e.clientX, y: e.clientY };
        renderer.domElement.setPointerCapture(e.pointerId);
      });
      renderer.domElement.addEventListener("pointermove", (e) => {
        if (!freeDrag || e.pointerId !== freeDrag.id || mode !== "free") return;
        const wpp = (2 * freeCam.height * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2))) / window.innerHeight;
        panFree(-(e.clientX - freeDrag.x) * wpp, -(e.clientY - freeDrag.y) * wpp);
        freeDrag.x = e.clientX;
        freeDrag.y = e.clientY;
      });
      const endFreeDrag = (e) => {
        if (freeDrag && e.pointerId === freeDrag.id) freeDrag = null;
      };
      renderer.domElement.addEventListener("pointerup", endFreeDrag);
      renderer.domElement.addEventListener("pointercancel", endFreeDrag);

      function setMode(next) {
        if (transit.isRiding && transit.isRiding()) return;
        const prevMode = mode;
        mode = next;
        btnWalk.classList.toggle("active", mode === "walk");
        btnFree.classList.toggle("active", mode === "free");
        if (mode === "walk") {
          avatar.visible = false;
          if (prevMode === "free") {
            // Leave top-down: restore the walker's spot and an upright camera.
            camera.up.copy(UP_WORLD);
            camera.rotation.set(0, walkSaved.yaw, 0, "YXZ");
            walkControls.getObject().position.set(walkSaved.x, eyeHeight, walkSaved.z);
          }
          walkControls.getObject().position.y = eyeHeight;
          softClampXZ(walkControls.getObject().position, playBounds);
          hint.textContent = "Walk: click + WASD · E tram · Esc · V free · N night";
          status.textContent = "Walking — Gounod tram halt";
        } else {
          if (walkControls.isLocked) walkControls.unlock();
          const p = walkControls.getObject().position;
          softClampXZ(p, playBounds);
          if (prevMode !== "free") {
            walkSaved.x = p.x;
            walkSaved.z = p.z;
            walkSaved.yaw = walkControls.getObject().rotation.y;
          }
          avatar.position.set(walkSaved.x, 0, walkSaved.z);
          avatar.rotation.y = walkSaved.yaw;
          avatar.visible = true;
          freeCam.x = walkSaved.x;
          freeCam.z = walkSaved.z;
          softClampXZ(freeCam, playBounds);
          applyFreeCamera();
          hint.textContent = "Free view (top-down): WASD pan · Shift fast · scroll zoom · V walk · N night";
          status.textContent = "Free view";
        }
      }

      function applyAlightDrop(drop) {
        if (!drop) return;
        walkControls.getObject().position.set(drop.x, eyeHeight, drop.z);
        softClampXZ(walkControls.getObject().position, playBounds);
        rideEl.style.display = "none";
        promptEl.style.display = "none";
        hint.textContent = "Walk: click + WASD · E tram · Esc · V free · N night";
        status.textContent = "Back on the street";
        if (mode === "walk" && !walkControls.isLocked) {
          // Keep unlocked until click — pointer lock after ride is flaky mid-frame.
        }
      }

      function handleTransitE() {
        if (mode !== "walk") return;
        const p = walkControls.getObject().position;
        const result = transit.tryInteract({ x: p.x, z: p.z });
        if (result.action === "board") {
          if (walkControls.isLocked) walkControls.unlock();
          avatar.visible = false;
          rideEl.style.display = "block";
          rideLine.textContent = `${result.mode === "bus" ? "Bus" : "Tram"} ${result.line}`;
          rideNext.textContent = `Next halt: ${result.nextHalt}`;
          promptEl.style.display = "none";
          hint.textContent = "Riding — E request stop · get off at next halt";
          status.textContent = `On board · next ${result.nextHalt}`;
        } else if (result.action === "request_alight") {
          rideNext.textContent = `Getting off at: ${result.nextHalt}`;
          hint.textContent = `Stop requested — leave at ${result.nextHalt}`;
          status.textContent = `Alighting at ${result.nextHalt}`;
        } else if (result.action === "alight") {
          applyAlightDrop(result.drop);
        }
      }

      function refreshTransitHud() {
        const hud = transit.getRideHud ? transit.getRideHud() : { riding: false };
        if (hud.riding) {
          rideEl.style.display = "block";
          rideLine.textContent = `${hud.mode === "bus" ? "Bus" : "Tram"} ${hud.line}`;
          if (hud.wantAlight) {
            rideNext.textContent = `Getting off at: ${hud.nextHalt}`;
          } else if (hud.dwelling && hud.currentHalt) {
            rideNext.textContent = `Stopped: ${hud.currentHalt} · next ${hud.nextHalt} · E to leave`;
          } else {
            rideNext.textContent = `Next halt: ${hud.nextHalt}`;
          }
          promptEl.style.display = "none";
        } else if (hud.prompt) {
          rideEl.style.display = "none";
          promptEl.style.display = "block";
          promptEl.textContent = hud.prompt;
        } else {
          if (!transit.isRiding || !transit.isRiding()) rideEl.style.display = "none";
          promptEl.style.display = "none";
        }
      }

      btnWalk.addEventListener("click", () => setMode("walk"));
      btnFree.addEventListener("click", () => setMode("free"));

      document.body.addEventListener("click", (e) => {
        if (mode !== "walk") return;
        if (e.target.closest("#modes")) return;
        if (!walkControls.isLocked) walkControls.lock();
      });
      walkControls.addEventListener("lock", () => {
        hint.textContent = "WASD · mouse look · Esc · V free view · N night";
      });
      walkControls.addEventListener("unlock", () => {
        if (mode === "walk") hint.textContent = "Walk: click + WASD · V free view · N night";
      });

      window.addEventListener("keydown", (e) => {
        if (e.code === "KeyE") {
          e.preventDefault();
          handleTransitE();
          return;
        }
        if (e.code === "KeyN") {
          toggleTimeOfDay();
          return;
        }
        if (e.code === "KeyV") {
          if (transit.isRiding && transit.isRiding()) return;
          setMode(mode === "walk" ? "free" : "walk");
          return;
        }
        if (e.code === "KeyW") keys.w = true;
        if (e.code === "KeyA") keys.a = true;
        if (e.code === "KeyS") keys.s = true;
        if (e.code === "KeyD") keys.d = true;
        if (e.code === "ShiftLeft" || e.code === "ShiftRight") keys.shift = true;
      });
      window.addEventListener("keyup", (e) => {
        if (e.code === "KeyW") keys.w = false;
        if (e.code === "KeyA") keys.a = false;
        if (e.code === "KeyS") keys.s = false;
        if (e.code === "KeyD") keys.d = false;
        if (e.code === "ShiftLeft" || e.code === "ShiftRight") keys.shift = false;
      });

      function applySpawnFromNode(node) {
        const p = new THREE.Vector3();
        node.getWorldPosition(p);
        spawnPos.copy(p);
        if (Math.abs(p.y - eyeHeight) > 3) spawnPos.y = eyeHeight;
        walkControls.getObject().position.copy(spawnPos);
        const e = new THREE.Euler().setFromQuaternion(node.getWorldQuaternion(new THREE.Quaternion()));
        walkControls.getObject().rotation.y = e.y;
      }

      function applySpawnJson(spawn) {
        spawnPos.set(spawn.x, spawn.z, -spawn.y);
        walkControls.getObject().position.copy(spawnPos);
        walkControls.getObject().rotation.y = spawn.yaw ?? 0;
      }

      async function loadSpawnJson() {
        try {
          const res = await fetch("./spawn.json");
          if (!res.ok) return null;
          return await res.json();
        } catch {
          return null;
        }
      }

      const loader = new GLTFLoader();
      loader.load(
        "./klein_antwerpen.glb",
        async (gltf) => {
          cityRoot = gltf.scene;
          // Cheap: disable expensive features for FPS; freeze static transforms.
          // Coplanar street layers: bias is monotone with the Blender height stack
          // (Z_GROUND < Z_PARK < Z_ROAD < markings < sidewalk < curb < tram bed < rails
          // < zebra-on-rails), so the offset can never invert the stack at distance.
          const layerBias = (name) => {
            const n = (name || "").toLowerCase();
            if (n.startsWith("zebra_rail")) return { factor: -5, units: -5 };
            if (n.startsWith("rail_")) return { factor: -4, units: -4 };
            if (n.startsWith("tram_")) return { factor: -3, units: -3 };
            if (n.startsWith("curb")) return { factor: -2, units: -2 };
            if (n.startsWith("sidewalk")) return { factor: -1, units: -1 };
            if (n.startsWith("zebra") || n.startsWith("dash")) return { factor: 0, units: 0 };
            if (n.startsWith("road_") || n.startsWith("park_path")) return { factor: 1, units: 1 };
            if (n.startsWith("park_")) return { factor: 2, units: 2 };
            if (n === "ground") return { factor: 3, units: 3 };
            return null;
          };
          cityRoot.traverse((obj) => {
            if (obj.isMesh) {
              obj.castShadow = false;
              obj.receiveShadow = false;
              obj.frustumCulled = true;
              if (obj.material) {
                const bias = layerBias(obj.name);
                // zebra_rail pieces share the stripe material with plain zebras but need a
                // different bias, so give them a private copy.
                if (bias && (obj.name || "").toLowerCase().startsWith("zebra_rail")) {
                  obj.material = Array.isArray(obj.material)
                    ? obj.material.map((m) => m.clone())
                    : obj.material.clone();
                }
                const mats = Array.isArray(obj.material) ? obj.material : [obj.material];
                const n = (obj.name || "").toLowerCase();
                const isFacade =
                  n.includes("facade") || n.includes("bldg_") || n.includes("chim") || n.includes("roof");
                for (const m of mats) {
                  if (!m) continue;
                  m.flatShading = !isFacade;
                  if (m.name && /glass/i.test(m.name)) {
                    m.metalness = Math.max(m.metalness ?? 0, 0.45);
                    m.roughness = Math.min(m.roughness ?? 1, 0.18);
                    m.envMapIntensity = 1.1;
                  } else if (isFacade && m.roughness != null) {
                    m.envMapIntensity = 0.35;
                  }
                  if (m.emissiveMap) glowMats.push({ mat: m, scale: 1.55 }); // lit windows
                  else if (m.name === "lamp_head") glowMats.push({ mat: m, scale: 2.6 }); // street lamps
                  if (bias) {
                    m.polygonOffset = true;
                    m.polygonOffsetFactor = bias.factor;
                    m.polygonOffsetUnits = bias.units;
                  }
                  m.needsUpdate = true;
                }
              }
            }
          });
          scene.add(cityRoot);
          cityRoot.updateMatrixWorld(true);
          cityRoot.traverse((obj) => {
            obj.matrixAutoUpdate = false;
            if (obj.isMesh && /^lamp_h_/i.test(obj.name || "")) {
              lampHeads.push(new THREE.Vector3().setFromMatrixPosition(obj.matrixWorld));
            }
          });
          const spawnNode = cityRoot.getObjectByName("HumanSpawn");
          const spawnJson = await loadSpawnJson();
          if (spawnNode) applySpawnFromNode(spawnNode);
          else if (spawnJson) applySpawnJson(spawnJson);
          setMode("walk");
          traffic = await createTraffic(scene, THREE);
          transit = await createTransit(scene, THREE, { tramCount: 6, busCount: 8 });
          // Cars give way to trams/buses instead of driving through them.
          if (traffic.setObstacles) traffic.setObstacles(() => transit.vehicles || []);
          const nCars = traffic.count ?? 0;
          const nTransit = transit.count ?? 0;
          const bits = [];
          if (nCars > 0) bits.push(`${nCars} cars`);
          if (nTransit > 0) bits.push(`${nTransit} trams/buses`);
          status.textContent =
            bits.length > 0
              ? `${tod > 0.5 ? "Night" : "Sunny day"} — ${bits.join(" · ")} · E boards the tram`
              : "Sunny day — click to walk";
          setupDistrictBounds(cityRoot);
          applyTimeOfDay(tod);
        },
        undefined,
        (err) => {
          status.textContent = "Missing GLB — CI/build pending";
          console.error(err);
        },
      );

      window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      function tick() {
        const time = performance.now();
        const dt = Math.min(0.05, (time - prevTime) / 1000);
        prevTime = time;

        const riding = transit.isRiding && transit.isRiding();

        if (!riding && mode === "walk" && walkControls.isLocked) {
          const step = walkSpeed * (keys.shift ? 1.85 : 1.0) * dt;
          if (keys.w) walkControls.moveForward(step);
          if (keys.s) walkControls.moveForward(-step);
          if (keys.a) walkControls.moveRight(-step);
          if (keys.d) walkControls.moveRight(step);
          walkControls.getObject().position.y = eyeHeight;
          softClampXZ(walkControls.getObject().position, playBounds);
        }
        if (!riding && mode === "free") {
          const panStep = freeCam.height * 0.9 * (keys.shift ? 2.2 : 1.0) * dt;
          // Screen-up is north (-Z); W pans toward it.
          panFree(((keys.d ? 1 : 0) - (keys.a ? 1 : 0)) * panStep, ((keys.s ? 1 : 0) - (keys.w ? 1 : 0)) * panStep);
          applyFreeCamera();
        }

        const walker =
          mode === "walk" ? walkControls.getObject() : avatar.visible ? avatar : walkControls.getObject();
        if (Math.abs(tod - todTarget) > 1e-4) {
          const step = dt / 2.4;
          tod = tod < todTarget ? Math.min(todTarget, tod + step) : Math.max(todTarget, tod - step);
          applyTimeOfDay(tod);
        }
        updateLampLights(dt, walker);
        if (stars.visible) stars.position.copy(camera.position);
        traffic.update(dt, walker);
        transit.update(dt, walker);

        // Auto-alight when the requested stop dwell begins.
        const pending = transit.consumePendingDrop && transit.consumePendingDrop();
        if (pending) applyAlightDrop(pending);

        if (riding && transit.getRideCamera && transit.getRideCamera(_rideCam, _rideLook)) {
          camera.position.lerp(_rideCam, Math.min(1, dt * 4));
          camera.lookAt(_rideLook);
        }

        refreshTransitHud();

        renderer.render(scene, camera);
        requestAnimationFrame(tick);
      }
      tick();
    </script>
  </body>
</html>
